name: Deployment Pipeline for DevSecOps
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read


jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make

      - name: Run tests
        run: make test

  build_image:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4


      - name: Build and push Docker image
        run: |
          docker build -t ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }} .
          docker push ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

      - name: Docker Scout
        id: docker-scout
        uses: docker/scout-action@v1
        with:
            command: quickview,cves,recommendations 



  deploy_app:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
       
      - name: Login to Docker Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set up azure container instance
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Deploy to Azure Container Instance
        uses: Azure/aci-deploy@v1
        with:
          resource-group: DemoAppRG
          dns-name-label: my-awesome-app
          registry-login-server: index.docker.io
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          image: index.docker.io/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}
          name: my-awesome-app
          location: 'North Europe'
          cpu: 1
          memory: 1.5
          ports: 5000


