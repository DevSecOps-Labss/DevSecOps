name: Deployment Pipeline for DevSecOps
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y make

      - name: Run tests
        run: make test

  build_image:
    runs-on: ubuntu-latest
    needs: run_tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to Docker Registry
        uses: docker/login-action@v1
        with:
          registry-login-server: index.docker.io
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }} .
          docker push ${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}

  permissions:
  id-token: write
  contents: read

  deploy_app:
    runs-on: ubuntu-latest
    needs: build_image
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: set up azure container instance
        uses: azure/login@v1
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Login to Docker Registry
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASS }}
      
      - name: Deploy to Azure Container Instance
        uses: Azure/aci-deploy@v1
        with:
          resource-group: DemoAppRG
          dns-name-label: MyAwesomeApp
          registry-login-server: index.docker.io
          image: index.docker.io/${{ vars.IMAGE_NAME }}:${{ vars.IMAGE_TAG }}
          name: MyAwesomeApp
          location: 'North Europe'
          cpu: 1
          memory: 1.5
          ports: 80 
